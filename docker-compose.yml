# PostgreSQL 16 for the MarketValue Player project.
#
# Why Docker Compose?
# - One command starts a reproducible database
# - Same setup for every classmate / recruiter machine
# - No need to install PostgreSQL natively
#
# Usage:
#   docker compose up -d
#   docker compose down

services:
  db:
    image: postgres:16
    container_name: marketvalue_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Expose Postgres on the host so Python (outside Docker) can connect.
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Persist data between container restarts.
      - postgres_data:/var/lib/postgresql/data
      # Run SQL scripts automatically on first database initialization.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
